name: Update igruha.json

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим запуска"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - fresh
          - news
          - check-updates

permissions:
  contents: write

concurrency:
  group: update-igruha
  cancel-in-progress: false

jobs:
  news:
    if: github.event_name == 'schedule' || inputs.mode == 'news' || inputs.mode == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrape news
        run: |
          node scrape.mjs --pages 5 --time-limit 20
          bash publish.sh "chore: scrape news pages [skip ci]"

  fresh:
    needs: news
    if: >-
      ${{
        always() &&
        (github.event_name == 'schedule' || inputs.mode == 'fresh' || inputs.mode == 'all') &&
        (needs.news.result == 'success' || needs.news.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrape fresh sitemap
        run: |
          node scrape.mjs --fresh --limit 1000 --time-limit 50
          bash publish.sh "chore: scrape fresh sitemap [skip ci]"

  catalog:
    needs: fresh
    if: >-
      ${{
        always() &&
        (github.event_name == 'schedule' || inputs.mode == 'all') &&
        (needs.fresh.result == 'success' || needs.fresh.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scrape catalog
        run: |
          node scrape.mjs --all --limit 2500 --time-limit 255
          bash publish.sh "chore: scrape catalog batch [skip ci]"

  check-updates:
    needs: [news, fresh, catalog]
    if: >-
      ${{
        always() &&
        (github.event_name == 'schedule' || inputs.mode == 'check-updates') &&
        (needs.news.result == 'success' || needs.news.result == 'skipped') &&
        (needs.fresh.result == 'success' || needs.fresh.result == 'skipped') &&
        (needs.catalog.result == 'success' || needs.catalog.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check updates
        run: |
          node scrape.mjs --check-updates --updates-limit 1500 --refresh --time-limit 150
          bash publish.sh "chore: check-updates sweep [skip ci]"
